name: build

on: [push, pull_request]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libjack-jackd2-dev libfreetype-dev \
            libfontconfig1-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev \
            libxcomposite-dev libxi-dev libgl1-mesa-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release ${{ runner.os == 'macOS' && '-DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"' || '' }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - uses: actions/upload-artifact@v4
        with:
          name: mjr-amp-${{ runner.os }}
          path: |
            build/MJRAmp_artefacts/Release/VST3
            build/MJRAmp_artefacts/Release/AU
            build/MJRAmp_artefacts/Release/Standalone
            build/MJRAmp_artefacts/VST3
            build/MJRAmp_artefacts/Standalone
          if-no-files-found: ignore

      - name: pluginval
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Linux.zip -o pv.zip
          unzip -q pv.zip
          xvfb-run -a ./pluginval --strictness-level 5 --validate-in-process "build/MJRAmp_artefacts/Release/VST3/MJR Amp.vst3"
